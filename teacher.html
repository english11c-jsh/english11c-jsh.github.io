<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="lexicon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14203A">
<link rel="manifest" href="manifest-teacher.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المعلم 11ج">
<meta name="description" content="منصة الإنجليزي للأول ثانوي (ج) – مدرسة جميل شاكر الثانوية للبنين">
<script src="config.js"></script>
<title>صفحة المعلم – منصة الإنجليزي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Amiri:wght@400;700&family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@500;700&family=DM+Serif+Display&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&display=swap" rel="stylesheet">
<style>
/* Paper & ink in the school's royal blue. Copper marks "now / due". Teal marks done & strong. */
:root{
  --paper:#EDF1F6; --card:#FFFFFF; --ink:#0F2440; --muted:#5A6B80; --line:#D9E1EB; --line2:#E9EEF4;
  --blue:#1D4F8C; --deep:#102F55; --deep2:#0B2442; --sky:#E4ECF7;
  --teal:#12817A; --teal-l:#E0F2EF; --copper:#C0702F; --copper-l:#FBEBDD;
  --bad:#B23A35; --bad-l:#FBE6E4; --mid:#9A6A16; --mid-l:#FBF1DC;
  --ar:"Cairo",system-ui,sans-serif; --book:"Literata",Georgia,"Times New Roman",serif;
  --r:12px;
}
*{box-sizing:border-box}
html,body,.modal,.loader,#xSheet{direction:rtl}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ar);font-size:16px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.en{font-family:var(--book);direction:ltr;text-align:left;unicode-bidi:isolate}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.76rem}
h1,h2,h3{line-height:1.35;margin:0} h1{font-size:1.5rem;font-weight:800} h2{font-size:1.15rem;font-weight:800} h3{font-size:1rem;font-weight:700}
.hidden{display:none!important}
.stack{display:grid;gap:14px} .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between}

/* top bar + hero band */
.top{background:var(--deep2);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.top img{width:42px;height:auto}
.top .t1{font-weight:800;font-size:1rem;line-height:1.3}
.top .t2{font-size:.78rem;color:#B9C8DC}
.top .sp{flex:1}
.band{background:var(--deep);color:#fff;padding:18px 0 54px}
.band h1{font-size:1.45rem}
.band .muted{color:#B9C8DC}
.lift{margin-top:-40px;position:relative}
main.wrap{padding-bottom:24px}

/* the semester ribbon — the one memorable element */
.ribbon{margin-top:22px}
.track{position:relative;height:40px;border-radius:8px;background:rgba(255,255,255,.07)}
.seg{position:absolute;top:0;bottom:0;border-inline-start:2px solid var(--deep);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:#D6E2F2;background:rgba(255,255,255,.10);overflow:hidden;white-space:nowrap}
.seg.past{background:rgba(255,255,255,.18);color:#fff}
.seg.cur{background:#fff;color:var(--deep)}
.seg.rev{background:rgba(255,255,255,.05);font-weight:600;font-size:.72rem}
.seg.exam{background:var(--copper);color:#fff;font-size:.75rem}
.seg.soon{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 6px,rgba(255,255,255,.12) 6px 12px)}
.seg.soon.cur{background:#fff}
.pin{position:absolute;top:-8px;bottom:-8px;width:0;border-inline-start:3px solid #F3B27A;z-index:2}
.pin span{position:absolute;top:-22px;transform:translateX(50%);inset-inline-start:0;background:#F3B27A;color:var(--deep2);font-size:.7rem;font-weight:800;border-radius:6px;padding:0 6px;white-space:nowrap}
.months{position:relative;overflow:hidden;height:20px;margin-top:6px;font-size:.72rem;color:#9FB3CC}
.months span{position:absolute;transform:translateX(50%);white-space:nowrap}
.rcap{margin-top:8px;font-size:.88rem;color:#D6E2F2}
.rcap b{color:#fff}
.ribbon.light .track{background:var(--sky)}
.ribbon.light .seg{border-color:#fff;color:var(--blue);background:#D3E0F1}
.ribbon.light .seg.past{background:#B9CDE6;color:var(--deep)}
.ribbon.light .seg.cur{background:var(--blue);color:#fff}
.ribbon.light .seg.rev{background:#E6EDF6}
.ribbon.light .seg.exam{background:var(--copper);color:#fff}
.ribbon.light .seg.soon{background:repeating-linear-gradient(-45deg,#E6EDF6 0 6px,#DCE5F1 6px 12px)}
.ribbon.light .seg.soon.cur{background:var(--blue);color:#fff}
.ribbon.light .months{color:var(--muted)} .ribbon.light .rcap{color:var(--muted)} .ribbon.light .rcap b{color:var(--ink)}

/* surfaces */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel.flush{padding:0;overflow:hidden}
.panel > .ph{padding:14px 16px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.list > .li{padding:12px 16px;border-bottom:1px solid var(--line2)}
.list > .li:last-child{border-bottom:0}
.next{border:0;border-inline-start:6px solid var(--copper);box-shadow:0 10px 30px rgba(11,36,66,.16)}
.next .lbl{color:var(--copper);font-weight:800;font-size:.85rem}
.next h2{font-family:var(--book);font-size:1.3rem;font-weight:600}

/* buttons, chips */
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--deep)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue)}
.btn.ghost:hover{background:var(--sky)}
.btn.light{background:rgba(255,255,255,.12);color:#fff} .btn.light:hover{background:rgba(255,255,255,.2)}
.btn.copper{background:var(--copper)} .btn.copper:hover{background:#A65E24}
.btn.teal{background:var(--teal)} .btn.danger{background:var(--bad)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.88rem}
.btn.link{background:none;color:var(--blue);padding:0;min-height:0;text-decoration:underline;text-underline-offset:3px;display:inline}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;white-space:nowrap;background:var(--line2);color:var(--ink)}
.chip.ok,.lv-strong{background:var(--teal-l);color:var(--teal)}
.chip.mid,.lv-mid{background:var(--mid-l);color:var(--mid)}
.chip.bad,.lv-weak{background:var(--bad-l);color:var(--bad)}
.chip.now{background:var(--copper-l);color:#8E4D17}
.chip.lock,.lv-none{background:var(--line2);color:var(--muted)}
.chip.dark{background:rgba(255,255,255,.14);color:#fff}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;scrollbar-width:none}
.tab{white-space:nowrap;border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:700;cursor:pointer;min-height:40px;color:var(--muted)}
.tab.on{background:var(--blue);color:#fff}
.seg2{display:inline-flex;background:var(--line2);border-radius:10px;padding:3px}
.seg2 button{border:0;background:none;border-radius:8px;padding:6px 14px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg2 button.on{background:#fff;color:var(--blue);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* bottom nav (student) */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav button{border:0;background:transparent;border-radius:10px;padding:6px 2px;font-weight:700;font-size:.8rem;cursor:pointer;min-height:54px;display:grid;justify-items:center;align-content:center;gap:2px;color:var(--muted);position:relative}
.nav svg{width:22px;height:22px}
.nav button.on{color:var(--blue);background:var(--sky)}
.nav .badge{position:absolute;top:4px;inset-inline-end:22%;background:var(--copper);color:#fff;border-radius:999px;font-size:.66rem;min-width:18px;height:18px;display:grid;place-items:center}
body.has-nav main.wrap{padding-bottom:96px}

/* lessons path (a real sequence: vertical timeline) */
.week{margin-top:6px}
.week .wh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 4px 6px}
.week .wh b{font-size:.92rem}
.path{position:relative;display:grid;gap:10px;padding-inline-start:28px}
.path::before{content:"";position:absolute;inset-inline-start:11px;top:8px;bottom:8px;width:2px;background:var(--line)}
.ls{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.ls::before{content:"";position:absolute;inset-inline-start:-23px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.ls.done::before{background:var(--teal);border-color:var(--teal)}
.ls.cur{border-color:var(--copper);box-shadow:0 0 0 3px var(--copper-l)}
.ls.cur::before{background:var(--copper);border-color:var(--copper)}
.ls.locked{background:transparent;border-style:dashed}
.ls .tt{font-family:var(--book);font-weight:600;font-size:1.02rem}
.ls .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.kind{font-size:.74rem;font-weight:700;color:var(--muted)}

/* lesson content */
.lsec{display:grid;gap:12px}
.lsec h2.hd{margin-top:10px;padding-bottom:6px;border-bottom:2px solid var(--sky);color:var(--deep);display:flex;gap:8px;align-items:center}
.hn{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:8px;background:var(--blue);color:#fff;font-size:.9rem}
.rule{border-inline-start:4px solid var(--blue);background:var(--sky);border-radius:10px;padding:10px 14px}
.use{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.use .u-en{font-weight:600}
.ex{display:grid;gap:2px;margin-top:8px;padding-inline-start:12px;border-inline-start:3px solid var(--teal-l)}
.ex .e{font-family:var(--book);direction:ltr;text-align:left} .ex .a{color:var(--muted);font-size:.9rem;margin-bottom:4px}
.keys{display:flex;gap:6px;flex-wrap:wrap;direction:ltr;justify-content:flex-end;margin-top:4px}
.keys span{font-family:var(--book);background:var(--copper-l);color:#7A4214;border-radius:8px;padding:2px 9px;font-size:.92rem}
.note{background:var(--teal-l);color:#0D5B56;border-radius:10px;padding:10px 14px}
.pairs .p{display:grid;gap:2px;padding:8px 0;border-bottom:1px dashed var(--line)}
.rbar{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0;display:flex;gap:8px;flex-wrap:wrap}
.para{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.para .lab{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--deep);color:#fff;font-weight:700;font-family:var(--book);margin-bottom:8px}
.glossed{direction:ltr;text-align:left;line-height:1.15}
.tok{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;margin:0 2px 14px}
.tok i{font-style:normal;font-family:var(--ar);font-size:.68rem;color:var(--teal);direction:rtl;min-height:1.3em;line-height:1.3em;white-space:nowrap}
.tok b{font-weight:400;font-family:var(--book);font-size:1.1rem;white-space:nowrap}
.noglo .tok i{visibility:hidden}
.para details{margin-top:4px;background:var(--sky);border-radius:10px;padding:8px 12px}
.para summary{cursor:pointer;font-weight:700;color:var(--deep)}
.finish{border:2px dashed var(--copper);text-align:center;background:#FFFCF8}

/* quiz */
.timer{position:sticky;top:0;z-index:8;background:var(--deep);color:#fff;padding:8px 16px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.timer .en{font-family:var(--ar);font-variant-numeric:tabular-nums;font-size:1.1rem}
.timer.low{background:var(--bad)}
.qprog{height:6px;background:var(--line);border-radius:999px;overflow:hidden} .qprog i{display:block;height:100%;background:var(--copper);transition:width .25s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.qt{font-family:var(--book);font-size:1.18rem;font-weight:500;line-height:1.55;direction:ltr;text-align:left;margin:4px 0 14px}
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;cursor:pointer;min-height:52px;direction:ltr;text-align:left;background:#fff;position:relative}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--line2);color:var(--muted);font-family:var(--book)}
.opt .tx{font-family:var(--book);font-size:1.05rem}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:hover{border-color:#A9BCD4}
.opt.sel{border-color:var(--blue);background:var(--sky)} .opt.sel .k{background:var(--blue);color:#fff}
.opt:focus-within{outline:3px solid #9CC3E8;outline-offset:1px}
.opt.right{border-color:var(--teal);background:var(--teal-l)} .opt.right .k{background:var(--teal);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-l)} .opt.wrong .k{background:var(--bad);color:#fff}
.opt .tag{margin-inline-start:auto;font-family:var(--ar);font-size:.8rem;font-weight:700;direction:rtl}
.qnav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.dots button.a{background:var(--teal-l);border-color:var(--teal);color:var(--teal)}
.dots button.c{border-color:var(--copper);box-shadow:0 0 0 2px var(--copper-l)}
.pspanel{max-height:46vh;overflow:auto;background:#FFFDF9;border:1px solid var(--line);border-radius:12px;padding:14px;direction:ltr;text-align:left;font-family:var(--book);line-height:1.7}
.pspanel p{margin:0 0 10px}
.bigscore{font-size:3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}

/* tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:9px 12px;border-bottom:1px solid var(--line2);text-align:right;vertical-align:middle}
th{background:#F5F8FB;font-weight:700;white-space:nowrap;color:var(--muted);font-size:.8rem}
td.num,th.num{text-align:center;font-variant-numeric:tabular-nums}
tbody tr:hover{background:#FAFCFE}
.gb td,.gb th{padding:7px 8px}
.gb th.stk,.gb td.stk{position:sticky;inset-inline-start:0;background:#fff;z-index:1;box-shadow:-1px 0 0 var(--line2) inset}
.gb th.stk{background:#F5F8FB}
.gb td.stk{min-width:170px;cursor:pointer;white-space:nowrap}
.gb td.stk:hover{color:var(--blue)}
.cell{display:inline-block;min-width:44px;border-radius:7px;padding:2px 6px;font-weight:700;font-size:.82rem;text-align:center}
.c-g{background:var(--teal-l);color:var(--teal)} .c-m{background:var(--mid-l);color:var(--mid)} .c-b{background:var(--bad-l);color:var(--bad)} .c-n{color:#B3BFCC}
.bar{height:8px;background:var(--line2);border-radius:999px;overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:999px}
.bar.weak>i{background:var(--bad)} .bar.mid>i{background:#D49A2A}

/* teacher bits */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--card);padding:14px 16px}
.kpi .v{font-size:1.75rem;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:.82rem}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.sc{display:grid;grid-template-columns:50px 1fr;gap:12px;align-items:center;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.sc:hover{border-color:var(--blue)}
.ring{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.86rem;background:var(--line2);color:var(--muted)}
.ring.g{background:var(--teal-l);color:var(--teal)} .ring.m{background:var(--mid-l);color:var(--mid)} .ring.b{background:var(--bad-l);color:var(--bad)}
.sc .nm{font-weight:700;line-height:1.35}
.miss{display:flex;gap:6px;flex-wrap:wrap}
.miss span{background:var(--copper-l);color:#7A4214;border-radius:8px;padding:2px 8px;font-size:.8rem}
.examlive{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sw li{margin:4px 0}
.search{max-width:340px}
label.f{display:grid;gap:4px;font-weight:700}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=datetime-local],textarea,select{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;min-height:44px;width:100%}
input:focus,textarea:focus,select:focus,.btn:focus-visible,.tab:focus-visible,.nav button:focus-visible{outline:3px solid #9CC3E8;outline-offset:1px}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
.alert{border-radius:10px;padding:10px 14px}
.a-weak{background:var(--bad-l);color:#7A2323} .a-good{background:var(--teal-l);color:#0D5B56} .a-info{background:var(--sky);color:var(--deep)}
.loader{position:fixed;inset:0;background:rgba(237,241,246,.6);display:grid;place-items:center;z-index:50}
.loader span{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(11,36,66,.5);z-index:40;display:grid;place-items:start center;overflow:auto;padding:24px 12px}
.modal .panel{max-width:880px;width:100%}
.login{max-width:400px;width:100%;margin:0 auto}
.login img{width:84px;display:block;margin:0 auto 4px}
.center{min-height:72vh;display:grid;place-items:center}
.uchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.uchips button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;color:var(--muted);min-height:38px}
.uchips button.on{background:var(--deep);border-color:var(--deep);color:#fff}
.xpin{position:absolute;top:-6px;bottom:-6px;width:0;border-inline-start:3px dashed #fff;z-index:3}
.xpin span{position:absolute;bottom:-22px;transform:translateX(50%);inset-inline-start:0;background:var(--copper);color:#fff;font-size:.68rem;font-weight:800;border-radius:6px;padding:0 6px;white-space:nowrap}
.ribbon.light .xpin{border-color:var(--copper)}
.ribbon .months{margin-top:20px}
.xcaps{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:4px}
.xcap{display:inline-block}
.semsw button{padding:6px 12px}
.band .semsw{background:rgba(255,255,255,.14)} .band .semsw button{color:#D6E2F2} .band .semsw button.on{color:var(--blue)}
details.xu{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
details.xu summary{cursor:pointer;list-style:none}
.xls{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 12px;margin-top:8px}
.xls label{display:flex;gap:6px;align-items:center}
input.mk{width:76px;text-align:center;padding:4px 6px}
input.mk::placeholder{color:#9AA8BA}
.ntc{place-items:center;z-index:60}

/* ---- round 3: layout & new pieces ---- */
.wrap{max-width:1180px}
.tlay{display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:10px}
.sg{display:grid;gap:2px}
.sgl{font-size:.74rem;font-weight:800;color:var(--muted);padding:4px 10px 2px}

[data-theme="heritage"] body{background:var(--paper) var(--field)}
[data-theme="heritage"] .top{background:var(--deep2) var(--bandtop) repeat-x left bottom/auto 12px;border-bottom:0;padding-bottom:12px}

[data-theme="heritage"] .band::after{display:none}
[data-theme="heritage"] .band h1,[data-theme="heritage"] .lgh b,[data-theme="heritage"] .login h1,[data-theme="heritage"] .cel h2{font-family:var(--kufi);font-weight:700;letter-spacing:0}
[data-theme="heritage"] .band h1{font-size:1.9rem;color:var(--sand)}
[data-theme="heritage"] .band .chip.dark{background:rgba(235,220,199,.16);color:var(--sand)}
[data-theme="heritage"] .pin{border-color:#E7C277} [data-theme="heritage"] .pin span{background:#E7C277}
[data-theme="heritage"] .panel{border:1.5px solid var(--line);box-shadow:var(--sh)}
[data-theme="heritage"] .panel > .ph{background:var(--sand2)}
[data-theme="heritage"] h2,[data-theme="heritage"] .phead h2{color:var(--deep2)}
html.dark[data-theme="heritage"] h2{color:var(--sand)}
[data-theme="heritage"] .btn{border-radius:14px}
[data-theme="heritage"] .chip{border-radius:999px}
/* the next step: an arch like the doorway of al-Khazneh */
[data-theme="heritage"] .next{background:var(--deep);color:#fff;border:0;text-align:center;justify-items:center;border-radius:220px 220px 22px 22px/96px 96px 22px 22px;padding:40px 22px 24px;position:relative;box-shadow:0 18px 40px -20px rgba(10,63,41,.7)}
[data-theme="heritage"] .next::after{content:"";position:absolute;inset:8px;border:1.5px solid rgba(235,220,199,.35);border-radius:212px 212px 16px 16px/90px 90px 16px 16px;pointer-events:none}
[data-theme="heritage"] .next .lbl{color:var(--sand)}
[data-theme="heritage"] .next h2,[data-theme="heritage"] .next .en{font-family:var(--disp);font-weight:400;color:#fff;text-align:center;font-size:1.9rem;line-height:1.15}
[data-theme="heritage"] .next .muted,[data-theme="heritage"] .next .muted .en{color:#D8CBB5;font-family:var(--ar);font-size:.9rem}
[data-theme="heritage"] .next .btn.ghost{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55);background:transparent}
[data-theme="heritage"] .next > *{position:relative;z-index:1}
/* tiles: diamond icons, one colour of thread each */
[data-theme="heritage"] .tile{border:1.5px solid var(--line);box-shadow:none}
[data-theme="heritage"] .tile:hover{border-color:var(--deep);box-shadow:var(--sh)}
[data-theme="heritage"] .tile .ti{background:none;position:relative;color:var(--deep)}
[data-theme="heritage"] .tile .ti::before{content:"";position:absolute;inset:6px;transform:rotate(45deg);border-radius:9px;background:var(--sky)}
[data-theme="heritage"] .tile .ti svg{position:relative}
[data-theme="heritage"] .tile:nth-child(3n+2) .ti{color:var(--copper)} [data-theme="heritage"] .tile:nth-child(3n+2) .ti::before{background:var(--copper-l)}
[data-theme="heritage"] .tile:nth-child(3n) .ti{color:var(--gold)} [data-theme="heritage"] .tile:nth-child(3n) .ti::before{background:var(--mid-l)}
[data-theme="heritage"] .tile .tb{background:var(--copper)}
/* stitched progress bars: each X is a tenth */
[data-theme="heritage"] .bar,[data-theme="heritage"] .wm .bar,[data-theme="heritage"] .qprog{height:12px;border-radius:0;-webkit-mask:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 12 12%22%3E%3Cpath d=%22M2 2l8 8M10 2l-8 8%22 stroke=%22%23000%22 stroke-width=%223%22 stroke-linecap=%22round%22/%3E%3C/svg%3E") repeat-x left center/12px 12px;mask:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 12 12%22%3E%3Cpath d=%22M2 2l8 8M10 2l-8 8%22 stroke=%22%23000%22 stroke-width=%223%22 stroke-linecap=%22round%22/%3E%3C/svg%3E") repeat-x left center/12px 12px;background:var(--line)}
[data-theme="heritage"] .bar>i,[data-theme="heritage"] .wm .bar i,[data-theme="heritage"] .qprog i{border-radius:0}
[data-theme="heritage"] .bar>i{background:var(--teal)} [data-theme="heritage"] .bar.mid>i{background:var(--gold)} [data-theme="heritage"] .bar.weak>i{background:var(--copper)}
[data-theme="heritage"] .qprog i{background:var(--copper)}
/* the lessons path: stitches instead of dots */
[data-theme="heritage"] .path::before{background:repeating-linear-gradient(180deg,var(--line) 0 6px,transparent 6px 10px)}
[data-theme="heritage"] .ls{border:1.5px solid var(--line);box-shadow:none}
[data-theme="heritage"] .ls::before{border-radius:2px;transform:rotate(45deg)}
[data-theme="heritage"] .ls.cur{border-color:var(--copper);box-shadow:0 0 0 3px var(--copper-l)}
[data-theme="heritage"] .lhero{background:var(--band) repeat-x left bottom/auto 12px,linear-gradient(160deg,var(--deep2),var(--deep) 70%);padding-bottom:34px;box-shadow:0 16px 36px -18px rgba(10,63,41,.6)}
[data-theme="heritage"] .lhero::after{border:0;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22 viewBox=%220 0 200 200%22%3E%3Cpath d=%22M100.0 0.0L126.9 44.1L178.2 37.7L160.4 86.2L197.5 122.3L148.5 138.7L143.4 190.1L100.0 162.0L56.6 190.1L51.5 138.7L2.5 122.3L39.6 86.2L21.8 37.7L73.1 44.1Z%22 fill=%22%23EBDCC7%22 opacity=%220.1%22/%3E%3C/svg%3E") center/contain no-repeat;width:220px;height:220px;top:-50px;inset-inline-end:-50px;border-radius:0}
[data-theme="heritage"] .lhero h1{font-family:var(--disp);font-weight:400}

/* ===================== website shell ===================== */
.skip{position:absolute;inset-inline-start:8px;top:-60px;z-index:100;background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px;font-weight:700}

.tools{display:flex;align-items:center;gap:6px;flex:none}
.tbtn{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:inherit;border-radius:10px;min-height:36px;min-width:38px;padding:4px 10px;font-weight:700;font-size:.86rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}

.tbtn.out{border-color:transparent;background:var(--copper)}

/* ============ theme: «القاموس الإنجليزي» (lexicon) — navy ink, Oxford claret, brass; Caslon for English, Amiri for Arabic headings ============ */
.lxo{display:none}

.lx{display:none}
[data-theme="lexicon"]{--paper:#F3F4F6;--card:#FFFFFF;--ink:#14203A;--muted:#5D6578;--line:#DDE1E8;--line2:#EBEEF2;--blue:#14203A;--deep:#14203A;--deep2:#0D1628;--sky:#EEF1F6;--teal:#2F6B57;--teal-l:#E5F0EB;--copper:#7E1F2E;--copper-l:#F6E8EA;--bad:#A3262E;--bad-l:#F8E6E7;--mid:#8F6514;--mid-l:#F8EFDC;--gold:#A88544;--sand:#E7D7B5;--sand2:#F7F4EC;--kufi:"Amiri",serif;--disp:"Libre Caslon Display","Libre Caslon Text",Georgia,serif;--book:"Libre Caslon Text",Georgia,"Times New Roman",serif;--arh:"Amiri","Cairo",serif;--sh:0 1px 2px rgba(20,32,58,.05);--r:14px;
  --band:linear-gradient(var(--gold),var(--gold)) center top/100% 1px no-repeat,linear-gradient(var(--gold),var(--gold)) center bottom/100% 1px no-repeat;
  --bandtop:linear-gradient(var(--gold),var(--gold)) left bottom/100% 2px no-repeat;--field:none}
html.dark[data-theme="lexicon"]{--paper:#0C1322;--card:#151E33;--ink:#E7EAF1;--muted:#9AA3B8;--line:#28324A;--line2:#1E2740;--blue:#C9D3E8;--deep:#0F1A30;--deep2:#080E1C;--sky:#1C2640;--teal:#6CC3A0;--teal-l:#163328;--copper:#E07A8A;--copper-l:#3A1820;--bad:#F08A92;--bad-l:#3A1820;--mid:#E3BE73;--mid-l:#33290F;--gold:#C9A869;--sand:#E7D7B5;--sand2:#1A2338}
[data-theme="lexicon"] body{background:var(--paper)}

<script>
var VIEW = 'teacher';
document.body.classList.toggle('tview', VIEW === 'teacher');
var S = { token: null, name: '', data: null, tab: 'home' };
var app = document.getElementById('app');
function who(n) { var w = $('who'); if (!w) return; w.textContent = n || ''; w.classList.toggle('hidden', !n); var cb = $('codeBtn'); if (cb) cb.classList.toggle('hidden', !n || VIEW === 'teacher'); }
function myCodeWin() {
  var w = winOpen('غيّر رمزك', '<div class="small muted">رمزك إلك لحالك. اختار رمز من 4 لـ 8 أرقام بتتذكره، ولا تعطيه لحدا. بعد التغيير بتضل داخل من هاد الجهاز، وأي جهاز ثاني بيطلع.</div>' +
    '<label class="f">رمزك الحالي<input type="password" id="mcOld" inputmode="numeric" maxlength="8" autocomplete="current-password"></label>' +
    '<label class="f">الرمز الجديد<input type="password" id="mcNew" inputmode="numeric" maxlength="8" autocomplete="new-password"></label>' +
    '<label class="f">أعد الرمز الجديد<input type="password" id="mcNew2" inputmode="numeric" maxlength="8" autocomplete="new-password"></label>' +
    '<div class="err" id="mcErr"></div><div class="row"><button class="btn" id="mcSave" type="button">غيّر الرمز</button></div>');
  w.querySelector('#mcSave').onclick = function () {
    var o = w.querySelector('#mcOld').value.trim(), n1 = w.querySelector('#mcNew').value.trim(), n2 = w.querySelector('#mcNew2').value.trim(), er = w.querySelector('#mcErr');
    if (!/^\d{4,8}$/.test(n1)) { er.textContent = 'الرمز الجديد لازم يكون أرقام بس، من 4 لـ 8 أرقام.'; return; }
    if (n1 !== n2) { er.textContent = 'الرمزين الجداد مش متطابقين.'; return; }
    er.textContent = 'جاري التغيير…';
    call('apiChangeCode', S.token, o, n1).then(function (r) { S.token = r.token; store('tk_' + VIEW, r.token); if (rmKey()) rmSave(r.token); winBack(); notice('تم تغيير رمزك. احفظه منيح، وادخل فيه المرة الجاية.', 'تم'); })
      .catch(function (e) { er.textContent = String(e && e.message || e); });
  };
}
/** Countdown to an exam: [data-cd] holds the time it opens; the clock follows the server's time, and the page refreshes itself when it reaches zero. */
var CD = { off: 0, iv: null, fired: {} };
function cdHtml(ts, sm) { return '<span class="cd' + (sm ? ' sm' : '') + '" data-cd="' + ts + '" aria-live="off"></span>'; }
function cdTick() {
  var now = Date.now() + CD.off, els = document.querySelectorAll('[data-cd]');
  if (!els.length) { clearInterval(CD.iv); CD.iv = null; return; }
  var due = false;
  each('[data-cd]', function (el) {
    var ts = Number(el.dataset.cd), left = ts - now;
    if (left <= 0) { el.className = el.className.replace(/ go/, '') + ' go'; el.innerHTML = 'بلّش وقته، حدّث الصفحة'; if (!CD.fired[ts]) { CD.fired[ts] = 1; due = true; } return; }
    var sec = Math.floor(left / 1000), d = Math.floor(sec / 86400), hh = Math.floor(sec % 86400 / 3600), mm = Math.floor(sec % 3600 / 60), ss = sec % 60, p = function (n) { return (n < 10 ? '0' : '') + n; };
    var u = function (v, l) { return '<span><b>' + v + '</b><i>' + l + '</i></span>'; };
    el.innerHTML = (d ? u(d, d === 1 ? 'يوم' : d === 2 ? 'يومين' : d <= 10 ? 'أيام' : 'يوم') : '') + u(p(hh), 'ساعة') + u(p(mm), 'دقيقة') + u(p(ss), 'ثانية');
  });
  if (due && S.token && VIEW !== 'teacher' && document.querySelector('#app [data-cd]')) setTimeout(function () { loadHome(S.tab); }, 1500);
}
function cdStart() { cdTick(); if (!CD.iv && document.querySelector('[data-cd]')) CD.iv = setInterval(cdTick, 1000); }
/** Student page tells the platform where he is (every ~30 s while on screen, and at once when he moves or leaves), so the teacher sees who is active now. */
var PR = { key: '', since: 0, sent: 0, iv: null };
var PAGE_AR = { home: 'الصفحة الرئيسية', lessons: 'قائمة الدروس', hw: 'قائمة الواجبات', exams: 'قائمة الامتحانات', results: 'علاماتي', teacher: 'الإعلانات والرسائل' };
function prWhere() {
  if (Q && Q.r) { if (Q.id === 'PRACTICE') return { k: 'practice', id: 'PRACTICE', t: 'تدريب حر' }; var it = (S.data && S.data.items || []).filter(function (i) { return i.id === Q.id; })[0]; return { k: it ? it.type : 'quiz', id: Q.id, t: String(Q.r.title || '').replace('Quiz – ', ''), att: Q.r.attemptId }; }
  if (LT) { var l = S.data ? lessonsOf(S.data).filter(function (x) { return x.id === LT.id; })[0] : null; return { k: 'lesson', id: LT.id, t: l ? l.title : LT.id }; }
  return { k: 'page', id: S.tab || 'home', t: PAGE_AR[S.tab] || 'المنصة' };
}
function prTick() {

// ---------- dates (Amman, UTC+3), Levantine month names
var MONTHS = ['كانون الثاني', 'شباط', 'آذار', 'نيسان', 'أيار', 'حزيران', 'تموز', 'آب', 'أيلول', 'تشرين الأول', 'تشرين الثاني', 'كانون الأول'];
var DAYS = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
function A(ts) { var d = new Date(ts + 3 * 3600e3); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), w: d.getUTCDay(), H: d.getUTCHours(), M: d.getUTCMinutes() }; }
function dDay(ts) { var a = A(ts); return DAYS[a.w] + ' ' + a.d + ' ' + MONTHS[a.m]; }
function dTime(ts) { var a = A(ts); var h12 = a.H % 12 || 12; return h12 + ':' + (a.M < 10 ? '0' : '') + a.M + (a.H < 12 ? ' ص' : ' م'); }
function dFull(ts) { return dDay(ts) + '، ' + dTime(ts); }
function dRange(ts) { var a = A(ts), b = A(ts + 4 * 864e5); return a.m === b.m ? a.d + '–' + b.d + ' ' + MONTHS[a.m] : a.d + ' ' + MONTHS[a.m] + ' – ' + b.d + ' ' + MONTHS[b.m]; }
function parseS(s) { var m = String(s || '').match(/(\d{4})\D(\d{2})\D(\d{2})\D(\d{2}):(\d{2})/); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4] - 3, +m[5]) : null; }

/** Wrap Latin runs so English reads left-to-right inside Arabic text. */
function fmtMixed(s) {
  s = String(s == null ? '' : s);
  if (!/[\u0600-\u06FF]/.test(s)) return '<span class="en" style="display:block">' + esc(s) + '</span>';
  // find the English runs in the raw text first, then escape each piece (escaping first broke quotes into "&quot;")
  var re = /[A-Za-z][A-Za-z0-9\u2019'\/\-.,\u2026?!:;+ ()"]*[A-Za-z0-9\u2019'.?!)\u2026"]|[A-Za-z]/g, out = '', last = 0, m;
  while ((m = re.exec(s))) {
    var w = m[0], tail = '';
    while (w.slice(-1) === ')' && (w.split(')').length > w.split('(').length)) { tail = ')' + tail; w = w.slice(0, -1); }
    out += esc(s.slice(last, m.index)) + '<span class="en" style="display:inline">' + esc(w) + '</span>' + esc(tail);
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}

// ---------- semester ribbon (official MoE calendar)
function ribbon(cal, light) {
  var s0 = cal.semStart, s1 = cal.examsTo, span = s1 - s0, now = cal.now;
  function pos(t) { return Math.max(0, Math.min(100, (t - s0) * 100 / span)); }
  var segs = cal.units.map(function (u) {
    var st = now > u.endTs ? 'past' : (now >= u.startTs ? 'cur' : '');
    return '<div class="seg ' + st + (u.ready ? '' : ' soon') + '" style="inset-inline-start:' + pos(u.startTs) + '%;width:' + (pos(u.endTs) - pos(u.startTs)) + '%" title="Unit ' + u.no + ' – ' + esc(u.title) + '">' + u.no + '</div>';
  });
  var lastEnd = Math.max.apply(null, cal.units.map(function (u) { return u.endTs; }));
  if (cal.examsFrom > lastEnd + 864e5) segs.push('<div class="seg rev" style="inset-inline-start:' + pos(lastEnd) + '%;width:' + (pos(cal.examsFrom) - pos(lastEnd)) + '%">مراجعة</div>');
  segs.push('<div class="seg exam" style="inset-inline-start:' + pos(cal.examsFrom) + '%;width:' + (100 - pos(cal.examsFrom)) + '%">امتحانات</div>');
  var months = [], a = A(s0), y = a.y, m = a.m + 1;
  while (true) { var t = Date.UTC(y + Math.floor(m / 12), m % 12, 1) - 3 * 3600e3; if (t > s1) break; if (pos(t) < 93) months.push('<span style="inset-inline-start:' + pos(t) + '%">' + MONTHS[m % 12] + '</span>'); m++; }
  var pin = now >= s0 && now <= s1 ? '<div class="pin" style="inset-inline-start:' + pos(now) + '%"><span>اليوم</span></div>' : '';
  var xp = (cal.exams || []).map(function (e) { return '<div class="xpin" style="inset-inline-start:' + pos(e.ts) + '%" title="' + esc(e.title) + ': ' + dFull(e.ts) + '"><span>' + (e.id === 'EX-MID' ? 'الميد' : 'الفاينل') + '</span></div>'; }).join('');
  var week = Math.floor((now - s0) / (7 * 864e5)) + 1;
  var cur = cal.units.filter(function (u) { return now >= u.startTs && now <= u.endTs; })[0];
  var days = Math.ceil((cal.examsFrom - now) / 864e5);
  var cap = now < s0 ? 'الفصل يبدأ ' + dDay(s0)
    : (now > cal.examsTo ? 'انتهى الفصل الأول' :
      'الأسبوع <b>' + week + '</b> من الفصل الأول' + (cur ? '، الوحدة <b>' + cur.no + '</b> <span class="en" style="display:inline">' + esc(cur.title) + '</span>' : '') +
      (days > 0 ? '. امتحانات نهاية الفصل بعد <b>' + days + '</b> يوم' : '. فترة الامتحانات'));
  var ex = (cal.exams || []).map(function (e) { return '<span class="xcap">' + (e.id === 'EX-MID' ? 'الميد' : 'الفاينل') + ': <b>' + dFull(e.ts) + '</b>' + (e.ts < now ? ' (مضى)' : '') + '</span>'; }).join('');
  return '<div class="ribbon' + (light ? ' light' : '') + '"><div class="track">' + segs.join('') + pin + xp + '</div><div class="months">' + months.join('') + '</div><div class="rcap">' + cap + '</div><div class="rcap xcaps">' + ex + '</div></div>';
}

var Q = null, tick = null;
function startQuiz(id) {
  PG.stack = [];

  if (exam) { examMode(true); fsEnter(); }          // full screen has to be asked for inside the tap itself
  busy(true);
  call('apiStart', S.token, id).then(function (r) {
    busy(false); nav(''); band('');
    if (!r.guard) examMode(false);
    Q = { r: r, answers: {}, i: 0, ps: true, offset: Date.now() - r.now, id: id, leaves: Number(store('lv_' + r.attemptId) || 0) };
    var saved = store('ans_' + r.attemptId); if (saved) try { Q.answers = JSON.parse(saved); } catch (e) {}
    if (r.guard) {
      Q.leaves = r.guard.leaves; Q.next = r.guard.next;

    }
    clearInterval(tick); tick = setInterval(clock, 1000);
    renderQuiz(); toContent();

}

// ---------- exam guard: full screen, warning on leaving, lock after 3 exits
var GD = { on: false, fs: false, last: 0, poll: null };
function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
function fsEnter() {
  var e = document.documentElement, f = e.requestFullscreen || e.webkitRequestFullscreen;
  if (!f) return;
  try { var pr = f.call(e, { navigationUI: 'hide' }); if (pr && pr.catch) pr.catch(function () {}); } catch (x) {}
}
function fsExit() {
  var f = document.exitFullscreen || document.webkitExitFullscreen;
  if (fsEl() && f) try { var pr = f.call(document); if (pr && pr.catch) pr.catch(function () {}); } catch (x) {}
}
function examMode(on) {
  GD.on = on; GD.fs = false;
  document.documentElement.classList.toggle('exammode', on);
  if (!on) { fsExit(); guardOverlay(false); clearInterval(GD.poll); }
  window.scrollTo(0, 0);
}
function answersArr() { return Q.r.questions.map(function (_, i) { return Q.answers[i] === undefined ? '' : Q.answers[i]; }); }
function guardActive() { return GD.on && Q && Q.r.guard && !Q.locked; }
function guardLeave() {
  if (!guardActive()) return;
  var t = Date.now(); if (t - GD.last < 2500) return;     // leaving the app also drops full screen: count it once
  GD.last = t; Q.leaves = (Q.leaves || 0) + 1;
  call('apiExamLeave', S.token, Q.r.attemptId, answersArr()).then(function (r) {
    if (!Q) return;
    Q.leaves = r.leaves; Q.next = r.next;
    if (r.locked) lockScreen(); else if (!document.hidden) guardOverlay(true);
  }).catch(function () {});
  if (!document.hidden) guardOverlay(true);
}
function guardOverlay(on) {
  var o = $('gov');
  if (!on) { if (o) o.remove(); return; }
  if (!Q || Q.locked) return;
  var left = Math.max(0, (Q.next || 3) - Q.leaves);
  if (!o) { o = document.createElement('div'); o.id = 'gov'; o.className = 'gov'; o.setAttribute('dir', 'rtl'); document.body.appendChild(o); }
  o.innerHTML = '<div class="panel stack" role="alertdialog" aria-modal="true" aria-labelledby="govT"><h2 id="govT">طلعت من صفحة الامتحان</h2>' +
    '<div class="alert a-weak">هاي المرة رقم ' + Q.leaves + '، ووصل تنبيه للأستاذ.</div>' +
    '<div>' + (left ? 'إذا طلعت ' + (left === 1 ? 'مرة كمان' : left + ' مرات كمان') + ' يتقفل امتحانك، وما تكمل إلا إذا سمحلك الأستاذ.' : 'لو طلعت مرة ثانية يتقفل امتحانك.') + '</div>' +
    '<button class="btn copper" id="govBack" type="button">رجوع للامتحان</button></div>';
  $('govBack').onclick = function () { fsEnter(); guardOverlay(false); };
}
function lockScreen() {
  if (!Q) return;
  Q.locked = true; clearInterval(tick); guardOverlay(false); fsExit();
  store('ans_' + Q.r.attemptId, JSON.stringify(Q.answers));
  var id = Q.id, aid = Q.r.attemptId, title = Q.r.title;
  h('<div class="center"><div class="panel login stack" style="text-align:center"><div class="lockic">' + ICO.lock + '</div><h1>امتحانك مقفل</h1>' +
    '<div class="muted en" style="text-align:center">' + esc(title) + '</div>' +
    '<div class="alert a-weak">طلعت من صفحة الامتحان ' + Q.leaves + ' مرات، فانقفل الامتحان ووصل للأستاذ.</div>' +
    '<div>إجاباتك محفوظة. لما يسمحلك الأستاذ تكمل من محل ما وقفت، ويرجعلك الوقت اللي كان ضايلك.</div>' +
    '<div class="small muted" id="lkMsg">نفحص كل كم ثانية إذا سمحلك…</div>' +
    '<button class="btn hidden" id="lkGo" type="button">كمّل الامتحان</button></div></div>');
  clearInterval(GD.poll);
  var check = function () {
    call('apiExamState', S.token, aid).then(function (r) {
      if (r.ended) { clearInterval(GD.poll); examStopped(); return; }
      if (r.locked) return;
      clearInterval(GD.poll);
      $('lkMsg').textContent = 'الأستاذ سمحلك تكمل.'; $('lkGo').classList.remove('hidden');
      $('lkGo').onclick = function () { Q = null; startQuiz(id); };
    }).catch(function () {});
  };
  GD.poll = setInterval(check, 10000);
}
document.addEventListener('visibilitychange', function () {
  if (!Q || Q.r.practice) return;
  if (Q.r.guard) { if (document.hidden) guardLeave(); else if (guardActive() && Date.now() - GD.last < 600000 && !$('gov') && !Q.locked && Q.leaves) guardOverlay(true); return; }
  if (document.hidden) { Q.leaves = (Q.leaves || 0) + 1; store('lv_' + Q.r.attemptId, String(Q.leaves)); }
});
['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) {
  document.addEventListener(ev, function () {
    if (!GD.on) return;
    if (fsEl()) { GD.fs = true; return; }
    if (GD.fs) { GD.fs = false; guardLeave(); }
  });
});

  each('.opt input', function (inp) {

/** Time on a lesson: counted only while the page is visible, sent every minute and when the student leaves. */
var LT = null;
function lessonTimer(id) {
  stopLessonTimer();
  LT = { id: id, acc: 0, from: document.hidden ? 0 : Date.now() };
  LT.iv = setInterval(function () { flushLesson(false); }, 60000);
  LT.vis = function () { if (!LT) return; if (document.hidden) { if (LT.from) { LT.acc += Date.now() - LT.from; LT.from = 0; } flushLesson(false); } else LT.from = Date.now(); };
  document.addEventListener('visibilitychange', LT.vis);
}
function flushLesson(stop) {
  if (!LT) return;
  if (LT.from) { LT.acc += Date.now() - LT.from; LT.from = document.hidden ? 0 : Date.now(); }
  var sec = Math.round(LT.acc / 1000);
  if (sec >= 5) { LT.acc = 0; call('apiLessonTime', S.token, LT.id, sec).catch(function () {}); }
  if (stop) { clearInterval(LT.iv); document.removeEventListener('visibilitychange', LT.vis); LT = null; }
}
function stopLessonTimer() { flushLesson(true); }

function fmtDur(sec) {
  sec = Math.round(sec || 0);
  if (!sec) return '—';
  var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? h + ' ساعة و ' + m + ' دقيقة' : (m ? m + ' دقيقة' : s + ' ثانية');
}

/** What one student did in every unit: lessons opened / time / studied, quizzes, homework, performance mark. */
function studentUnits(num, scope) {
  var d = T.data, s = d.students.filter(function (x) { return x.number === num; })[0];
  var v = d.views[num] || {}, st = d.studiedMap[num] || {}, cov = d.marks.coverage, pu = {};
  (d.marks.students[num].perf.units || []).forEach(function (u) { pu[u.id] = u; });
  var avg = function (list) { var g = list.filter(function (a) { return s.grades[a.id]; }); return { done: g.length, of: list.length, pct: g.length ? Math.round(list.reduce(function (x, a) { return x + (s.grades[a.id] ? s.grades[a.id].p : 0); }, 0) / list.length) : null }; };
  var rows = d.course.map(function (u) {
    var ls = scope === 'cov' ? u.lessons.filter(function (l) { return cov[u.id].lessons.indexOf(l.id) >= 0; }) : u.lessons;
    var ids = ls.map(function (l) { return l.id; });
    var qz = d.assessments.filter(function (a) { return a.type === 'quiz' && ids.indexOf(a.lesson) >= 0; });
    var hw = d.assessments.filter(function (a) { return a.type === 'homework' && a.unit === u.id && (scope !== 'cov' || s.grades[a.id] || a.state === 'closed'); });
    var opened = ls.filter(function (l) { return v[l.id]; }).length, secs = ls.reduce(function (x, l) { return x + (v[l.id] ? v[l.id].s : 0); }, 0);
    return { u: u, ls: ls, opened: opened, secs: secs, studied: ls.filter(function (l) { return st[l.id]; }).length, q: avg(qz), h: avg(hw), perf: pu[u.id] };
  });
  var head = '<thead><tr><th>الوحدة</th><th class="num">دخل الدروس</th><th class="num">درسها</th><th class="num">وقته على الوحدة</th><th class="num">الكويزات</th><th class="num">الواجبات</th><th class="num">الأدائي (30)</th></tr></thead>';
  var body = rows.map(function (r) {
    var det = r.ls.map(function (l) {
      var x = v[l.id], q = d.assessments.filter(function (a) { return a.type === 'quiz' && a.lesson === l.id; })[0], g = q && s.grades[q.id];
      return '<tr class="sub"><td><span class="en" style="display:inline">' + esc(l.title) + '</span>' + (l.open ? '' : ' <span class="chip lock">مغلق</span>') + '</td>' +
        '<td class="num">' + (x ? '<span class="chip ok">دخل</span><div class="tiny muted">' + dDay(x.f) + (x.o > 1 ? '، ' + x.o + ' مرات' : '') + '</div>' : '<span class="chip bad">لم يدخل</span>') + '</td>' +
        '<td class="num">' + (st[l.id] ? '<span class="chip ok">نعم</span>' : '—') + '</td><td class="num">' + fmtDur(x ? x.s : 0) + '</td>' +
        '<td class="num">' + (g ? cell(g.p, '<bdi>' + g.s + '/' + g.t + '</bdi>') : '<span class="cell c-n">لم يحل</span>') + '</td><td></td><td></td></tr>';
    }).join('');
    return '<tbody class="ug"><tr class="uh" data-ux="' + r.u.id + '"><td><b>الوحدة ' + r.u.no + '</b> <span class="tiny muted">(' + r.ls.length + ' درس)</span> <span class="ubtn">التفاصيل</span></td>' +

      '<td class="num">' + frac(r.q.done, r.q.of) + (r.q.pct !== null ? '<div>' + cell(r.q.pct) + '</div>' : '') + '</td>' +
      '<td class="num">' + frac(r.h.done, r.h.of) + (r.h.pct !== null ? '<div>' + cell(r.h.pct) + '</div>' : '') + '</td>' +
      '<td class="num">' + (r.perf ? '<b>' + r.perf.mark + '</b>' : '<span class="muted">لم تُقطع</span>') + '</td></tr></tbody>';

function mixOrder(id, n) {

function certWin(num) {
  var s = T.data.students.filter(function (x) { return x.number === num; })[0]; if (!s) return;
  var why = 'لتميّزه في مادة اللغة الإنجليزية' + (s.average !== null ? ' وحصوله على معدل ' + s.average + '% على المنصة' : '') + '، متمنّين له دوام التفوق والنجاح.';
  var o = { name: s.name, why: why, head: lget('headName') || '', date: dDay(Date.now()) };
  var w = winOpen('شهادة تقدير: ' + s.name, '<div class="two"><label class="f">اسم الطالب<input type="text" id="cfN" value="' + esc(o.name) + '"></label><label class="f">اسم مدير المدرسة (اختياري)<input type="text" id="cfH" value="' + esc(o.head) + '"></label></div>' +
    '<label class="f">سبب التقدير<textarea id="cfW" rows="2">' + esc(o.why) + '</textarea></label>' +
    xbar('cert') + '<div class="small muted">الشهادة على ورقة A4 بالعرض.</div><div id="cfV">' + certHtml(o) + '</div>');
  var upd = function () { o.name = w.querySelector('#cfN').value; o.head = w.querySelector('#cfH').value; o.why = w.querySelector('#cfW').value; lset('headName', o.head); w.querySelector('#cfV').innerHTML = certHtml(o); };
  ['#cfN', '#cfH', '#cfW'].forEach(function (k) { w.querySelector(k).oninput = upd; });
  XB.cert = { opts: { landscape: true, margin: 0, docxImage: true }, name: function () { return 'شهادة تقدير - ' + o.name; }, html: function () { upd(); return certHtml(o); } };
}

var LIB_H2C = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', LIB_PDF = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
var XB = {};
function needLibs(list) {
  var have = { docx: function () { return window.docx; }, xlsx: function () { return window.XLSX; }, h2c: function () { return window.html2canvas; }, pdf: function () { return window.jspdf; }, zip: function () { return window.JSZip; } };
  var url = { docx: LIB_DOCX, xlsx: LIB_XLSX, h2c: LIB_H2C, pdf: LIB_PDF, zip: LIB_ZIP };
  return list.reduce(function (p, k) { return p.then(function () { return have[k]() ? null : loadScript(url[k]); }); }, Promise.resolve());
}
/** The three export buttons. `key` names an entry in XB: {name(), html(), opts, docx(), xlsx(), pdf()} */
function xbar(key, small) {
  var c = small ? ' sm' : '';
  return '<div class="row xbar" data-xbar="' + key + '"><button class="btn' + c + '" data-xf="docx" type="button">تنزيل Word</button><button class="btn ghost' + c + '" data-xf="xlsx" type="button">تنزيل Excel</button><button class="btn ghost' + c + '" data-xf="pdf" type="button">تنزيل PDF</button><span class="small xmsg" role="status"></span></div>';
}
document.addEventListener('click', function (e) {
  var b = e.target && e.target.closest && e.target.closest('[data-xf]'); if (!b) return;
  var bar = b.closest('[data-xbar]'), X = bar && XB[bar.dataset.xbar]; if (!X) return;
  e.preventDefault();
  var fmt = b.dataset.xf, msg = bar.querySelector('.xmsg'), say = function (t) { if (msg) msg.textContent = t; };
  var lbl = { docx: 'Word', xlsx: 'Excel', pdf: 'PDF' }[fmt];
  if (bar.dataset.busy) return; bar.dataset.busy = '1';
  say('جاري تجهيز ملف ' + lbl + '…');
  var name = String(X.name()).replace(/[\\/:*?"<>|]/g, '-');
  var make = X[fmt] ? Promise.resolve().then(X[fmt]) : (fmt === 'docx' ? xDocx(X.html(), X.opts || {}) : fmt === 'xlsx' ? xXlsx(X.html(), X.opts || {}) : xPdf(X.html(), X.opts || {}));

    .then(function (r) { say(r && (r.status === 'delivered' || r.status === 'preview') ? '' : 'تم تجهيز ملف ' + lbl + '.'); })

        else if (xSections(M.el).length > 1) { var nmTry = (sec.querySelector('h1,h2,h3,b,strong') ? xText(sec.querySelector('h1,h2,h3,b,strong')) : '').replace(/[\\\/?*\[\]:]/g, ' ').slice(0, 28).trim(); if (nmTry) nm = nmTry; }
        var base = nm, k = 2; while (used[nm]) nm = base.slice(0, 25) + ' ' + (k++); used[nm] = 1;
        X.utils.book_append_sheet(wb, ws, nm);
      });
      M.done();
      return new Blob([X.write(wb, { type: 'array', bookType: 'xlsx' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    } catch (e) { M.done(); throw e; }
  });
}

// =================================================================== student protection (copy, paste, save, print, screenshots)
var PROT = { on: false };
function protect() {
  if (VIEW === 'teacher' || PROT.on) return;
  PROT.on = true;
  var root = document.documentElement; root.classList.add('nocopy');
  var editable = function (el) { return el && el.closest && el.closest('input,textarea,[contenteditable]'); };
  var stop = function (e) { e.preventDefault(); e.stopPropagation(); return false; };
  ['copy', 'cut'].forEach(function (ev) { document.addEventListener(ev, function (e) { if (e.clipboardData) e.clipboardData.setData('text/plain', ''); return stop(e); }, true); });
  document.addEventListener('paste', function (e) { if (e.target && (e.target.id === 'code' || e.target.id === 'num')) return; return stop(e); }, true);
  document.addEventListener('drop', stop, true);
  document.addEventListener('dragstart', stop, true);
  document.addEventListener('contextmenu', stop, true);
  document.addEventListener('selectstart', function (e) { if (!editable(e.target)) return stop(e); }, true);
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase(), mod = e.ctrlKey || e.metaKey;
    var login = e.target && (e.target.id === 'code' || e.target.id === 'num');
    if (mod && ['c', 'x', 'v', 'a', 's', 'p', 'u'].indexOf(k) >= 0 && !(k === 'a' && editable(e.target)) && !(k === 'v' && login)) return stop(e);
    if (mod && e.shiftKey && ['i', 'j', 'c', 's'].indexOf(k) >= 0) return stop(e);
    if (k === 'f12' || (e.shiftKey && k === 'insert')) return stop(e);
    if (k === 'printscreen') shieldFlash();
  }, true);
  document.addEventListener('keyup', function (e) { if ((e.key || '').toLowerCase() === 'printscreen') { shieldFlash(); try { navigator.clipboard && navigator.clipboard.writeText(''); } catch (x) {} } }, true);
  // hide the content whenever the page is not in front (app switcher, screen recorders, snipping tools)
  var sh = document.createElement('div'); sh.id = 'shield'; sh.innerHTML = '<div>ارجع للمنصة عشان يظهر المحتوى.</div>'; document.body.appendChild(sh);
  var hide = function () { root.classList.add('shielded'); }, show = function () { root.classList.remove('shielded'); };
  document.addEventListener('visibilitychange', function () { document.hidden ? hide() : show(); });
  window.addEventListener('blur', hide); window.addEventListener('focus', show);
  window.addEventListener('pagehide', hide); window.addEventListener('pageshow', show);
  window.addEventListener('beforeprint', hide); window.addEventListener('afterprint', show);
  document.addEventListener('pointerdown', show, true);
  // stop any text that is selected anyway (long-press on some phones)
  document.addEventListener('selectionchange', function () { var s = window.getSelection && window.getSelection(); if (s && s.rangeCount && !editable(document.activeElement)) { try { s.removeAllRanges(); } catch (x) {} } });
}
function shieldFlash() { var r = document.documentElement; r.classList.add('shielded'); setTimeout(function () { r.classList.remove('shielded'); }, 1500); }
// the student's name and number across the screen, so a shared photo or screenshot shows who took it
function watermark(name, num) {
  if (VIEW === 'teacher') return;
  var w = document.getElementById('wmark');
  if (!name) { if (w) w.remove(); return; }
  if (!w) { w = document.createElement('div'); w.id = 'wmark'; w.setAttribute('aria-hidden', 'true'); document.body.appendChild(w); }
  var txt = String(name).replace(/[<&>"]/g, '') + ' · ' + String(num || '');
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="260" height="150"><text x="130" y="80" text-anchor="middle" transform="rotate(-24 130 75)" font-family="Cairo,sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">' + txt + '</text></svg>';
  w.style.backgroundImage = 'url("data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) + '")';
}

(function () {
  document.documentElement.setAttribute('dir', 'rtl'); document.documentElement.setAttribute('lang', 'ar'); document.body.setAttribute('dir', 'rtl');

  var tk = store('tk_' + VIEW);

  if (VIEW === 'teacher') { if (r0) T.tab = r0; if (tk) { S.token = tk; loadTeacher(); } else rmResume(loadTeacher, function () { teacherLogin(); }); }

})();
